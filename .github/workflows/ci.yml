name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # test:integration runs under Node (node --test), not Bun - @testcontainers/postgresql
      # hangs indefinitely under Bun's wait-strategy handling (see NOTES.md).
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests (Bun, with coverage)
        run: bun run test:unit:coverage

      # The same integration tests as before, run with Node's coverage on (coverage/integration/lcov.info).
      - name: Integration tests (Node + Testcontainers, with coverage)
        run: bun run test:integration:coverage

      # One report: a line is covered if either suite ran it (scripts/merge-coverage.ts; docs/plans/test-coverage.md).
      - name: Merge unit and integration coverage
        run: bun run coverage:merge

      # Fails the build when a package falls below coverage-baseline.json (scripts/coverage-gate.ts). Raise the baseline with `bun run coverage:baseline`.
      - name: Coverage gate
        run: bun run coverage:check

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false
