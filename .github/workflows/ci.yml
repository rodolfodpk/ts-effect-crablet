name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: the OpenAPI check below compares with the base branch and reads the commits since it.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # test:integration runs under Node (node --test), not Bun - @testcontainers/postgresql
      # hangs indefinitely under Bun's wait-strategy handling (see docs/history/NOTES.md).
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # An API change that could break a client that is not TypeScript (scripts/openapi-breaking.ts, ADR-0013): fails unless a commit of the pull request has a "BREAKING:" line.
      - name: OpenAPI breaking changes
        if: github.event_name == 'pull_request'
        run: bun scripts/openapi-breaking.ts origin/${{ github.base_ref }}

      - name: Unit tests (Bun, with coverage)
        run: bun run test:unit:coverage

      # The wallet's commands with WALLET_PERIOD=minutes:5: the period is read when the model is loaded, so these tests need a process of their own.
      - name: Unit tests (5-minute statement period)
        run: bun run test:unit:period

      # The same integration tests as before, run with Node's coverage on (coverage/integration/lcov.info).
      - name: Integration tests (Node + Testcontainers, with coverage)
        run: bun run test:integration:coverage

      # One report: a line is covered if either suite ran it (scripts/merge-coverage.ts; docs/history/plans/test-coverage.md).
      - name: Merge unit and integration coverage
        run: bun run coverage:merge

      # Fails the build when a package falls below its baseline (crablet.coverage in its package.json; the policy in coverage-baseline.json; scripts/coverage-gate.ts). Raise the baseline with `bun run coverage:baseline`.
      - name: Coverage gate
        run: bun run coverage:check

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false
