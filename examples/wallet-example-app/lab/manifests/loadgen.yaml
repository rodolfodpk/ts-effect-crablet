# The load: every 30 seconds, a uniformly random number of commands from 1 to 100, all at once (examples/wallet-example-app/scripts/load.ts). It waits for the API, opens its wallets, and runs until deleted.
apiVersion: apps/v1
kind: Deployment
metadata: { name: loadgen, labels: { app: loadgen } }
spec:
  replicas: 1
  selector: { matchLabels: { app: loadgen } }
  template:
    metadata: { labels: { app: loadgen } }
    spec:
      containers:
        - name: loadgen
          image: crablet-wallet:lab
          imagePullPolicy: Never
          command: ["node", "scripts/load.ts", "--url", "http://wallet-api:8080", "--burst-every", "30", "--burst-max", "100", "--wallets", "25"]
