# The same image in two roles (ADR-0022): the API (stateless, scales with load) and the workers (views, automations, outbox: each module leads in one pod at a time, by an advisory lock).
# Pods of a kind are kept on different nodes, so losing a node costs at most one of each.
apiVersion: apps/v1
kind: Deployment
metadata: { name: wallet-api, labels: { app: wallet, role: api } }
spec:
  replicas: ${API_REPLICAS}
  selector: { matchLabels: { app: wallet, role: api } }
  template:
    metadata: { labels: { app: wallet, role: api } }
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - { topologyKey: kubernetes.io/hostname, labelSelector: { matchLabels: { app: wallet, role: api } } }
      containers:
        - name: wallet
          image: crablet-wallet:lab
          imagePullPolicy: Never
          env:
            - { name: WALLET_ROLES, value: api }
            - { name: WALLET_MIGRATE, value: "off" }
            - { name: WALLET_DB_HOST, value: postgres }
            - { name: WALLET_DB_POOL, value: "${POOL}" }
            - { name: WALLET_ADMIN_TOKEN, value: lab-token }
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /openapi.json, port: 8080 }, periodSeconds: 2 }
---
apiVersion: v1
kind: Service
metadata: { name: wallet-api }
spec:
  type: NodePort
  selector: { app: wallet, role: api }
  ports: [{ port: 8080, targetPort: 8080, nodePort: 30080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: wallet-workers, labels: { app: wallet, role: workers } }
spec:
  replicas: ${WORKER_REPLICAS}
  # A new pod starts as a follower and the old one releases its locks on SIGTERM, so one extra pod at a time and none missing.
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  selector: { matchLabels: { app: wallet, role: workers } }
  template:
    metadata: { labels: { app: wallet, role: workers } }
    spec:
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm: { topologyKey: kubernetes.io/hostname, labelSelector: { matchLabels: { app: wallet, role: workers } } }
      containers:
        - name: wallet
          image: crablet-wallet:lab
          imagePullPolicy: Never
          env:
            - { name: WALLET_ROLES, value: "views,automations,outbox" }
            - { name: WALLET_MIGRATE, value: "off" }
            - { name: WALLET_DB_HOST, value: postgres }
            - { name: WALLET_DB_POOL, value: "${POOL}" }
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 2 }
          livenessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 5, failureThreshold: 3 }
