# One Postgres, no volume: the lab starts from an empty database on purpose. ${PG_ARGS} is where a scenario puts server settings (keepalives, max_connections).
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, labels: { app: postgres } }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      nodeSelector: { lab/role: database }
      tolerations:
        - { key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }
      containers:
        - name: postgres
          image: postgres:18.6-alpine
          args: ${PG_ARGS}
          env:
            - { name: POSTGRES_DB, value: wallet_db }
            - { name: POSTGRES_USER, value: postgres }
            - { name: POSTGRES_PASSWORD, value: postgres }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "wallet_db"] }
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata: { name: postgres }
spec:
  type: NodePort
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432, nodePort: 30432 }]
