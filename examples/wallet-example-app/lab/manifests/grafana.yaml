# The same image as ops/compose.yaml (an OpenTelemetry Collector, Prometheus, Tempo, Loki and Grafana in one), pinned by version and digest, with the dashboard and the alerts mounted from the repository's files
# (the ConfigMap `grafana-crablet` is made from ops/grafana by the lab). The wallet pods export to grafana:4318 when the lab runs with observation.
apiVersion: apps/v1
kind: Deployment
metadata: { name: grafana, labels: { app: grafana } }
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana } }
  template:
    metadata: { labels: { app: grafana } }
    spec:
      containers:
        - name: grafana
          image: grafana/otel-lgtm:0.35.0@sha256:2de1094c593c671cbfca878a28ffcd7e46ff5e32f2ce966c0cf33003f6cf4266
          ports: [{ containerPort: 3000 }, { containerPort: 4317 }, { containerPort: 4318 }]
          readinessProbe: { httpGet: { path: /api/health, port: 3000 }, periodSeconds: 3, failureThreshold: 60 }
          volumeMounts:
            - { name: crablet, mountPath: /otel-lgtm/grafana/conf/provisioning/dashboards/crablet.yaml, subPath: provider.yaml, readOnly: true }
            - { name: crablet, mountPath: /crablet/dashboards/crablet-dashboard.json, subPath: crablet-dashboard.json, readOnly: true }
            - { name: crablet, mountPath: /otel-lgtm/grafana/conf/provisioning/alerting/crablet.yaml, subPath: alerts.yaml, readOnly: true }
      volumes:
        - { name: crablet, configMap: { name: grafana-crablet } }
---
# what the pods export to
apiVersion: v1
kind: Service
metadata: { name: grafana }
spec:
  selector: { app: grafana }
  ports: [{ name: otlp-grpc, port: 4317 }, { name: otlp-http, port: 4318 }]
---
# what the host opens (localhost:3000, through the kind port mapping)
apiVersion: v1
kind: Service
metadata: { name: grafana-ui }
spec:
  type: NodePort
  selector: { app: grafana }
  ports: [{ port: 3000, targetPort: 3000, nodePort: 30300 }]
